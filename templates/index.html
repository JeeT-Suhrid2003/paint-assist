<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Paint Palette Generator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .result-section { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <h2>Upload a Painting</h2>
    <form id="uploadForm">
        <input type="file" id="paintingInput" accept="image/*" required><br><br>
        <button type="submit" id="submitButton">Analyze Colors</button>
    </form>
    <p id="status" style="display:none; margin-top:10px; font-style:italic;"></p>

    <div id="results" class="result-section">
        <h3>Required Base Paints:</h3>
        <ul id="basePaints"></ul>
        
        <h3>Color Mixing Recipes:</h3>
        <ul id="recipes"></ul>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('paintingInput');
            const submitButton = document.getElementById('submitButton');
            const status = document.getElementById('status');

            if (!fileInput.files.length) {
                status.textContent = 'Please select an image to analyze.';
                status.style.display = 'block';
                return;
            }

            submitButton.disabled = true;
            fileInput.disabled = true;
            status.textContent = 'Analyzing image, please wait...';
            status.style.display = 'block';
            document.getElementById('results').style.display = 'none';

            const formData = new FormData();
            formData.append('painting', fileInput.files[0]);

            try {
                const response = await fetch('/analyze', { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) {
                    status.textContent = data.error || 'Error analyzing image. Please try again.';
                    return;
                }

                // Clear old results
                const basePaints = document.getElementById('basePaints');
                const recipes = document.getElementById('recipes');
                basePaints.innerHTML = '';
                recipes.innerHTML = '';

                // Display Base Paints
                if (Array.isArray(data.base_paints)) {
                    data.base_paints.forEach(paint => {
                        const li = document.createElement('li');
                        li.textContent = paint;
                        basePaints.appendChild(li);
                    });
                }

                // Display Recipes
                if (Array.isArray(data.color_mixtures)) {
                    data.color_mixtures.forEach(mix => {
                        const li = document.createElement('li');
                        let recipeString = '';

                        if (mix && typeof mix.recipe === 'object' && mix.recipe !== null) {
                            recipeString = Object.entries(mix.recipe)
                                .map(([paint, percentage]) => `${percentage}% ${paint}`)
                                .join(' + ');
                        } else {
                            recipeString = mix.recipe || 'No recipe available';
                        }

                        li.innerHTML = `<strong>${mix.target_color || 'Target color'}:</strong> ${recipeString}`;
                        recipes.appendChild(li);
                    });
                }

                document.getElementById('results').style.display = 'block';
                status.textContent = 'Analysis complete!';
            } catch (error) {
                status.textContent = 'Network error while analyzing image. Please try again.';
            } finally {
                submitButton.disabled = false;
                fileInput.disabled = false;
            }
        });
    </script>
</body>
</html>
